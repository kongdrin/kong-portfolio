name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # 사이트에 필요 없는 저장소 문서는 빼고 _site에 모읍니다.
      # 점(.)으로 시작하는 파일·폴더는 upload-pages-artifact가 자동으로 제외합니다.
      - name: 배포 파일 모으기
        run: |
          mkdir _site
          tar -cf - \
            --exclude='./.*' \
            --exclude='./_site' \
            --exclude='./CLAUDE.md' \
            --exclude='./README.md' \
            . | tar -xf - -C _site
          ls -la _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
